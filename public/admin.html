<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Admin · THE ALPHA GAMER</title>
<style>
:root{--bg:#070d1c;--card:#0f1a33;--line:#1d2b4d;--tx:#eef2ff;--mu:#8e9bbd;--or:#ff7a1a;--am:#ffc233;--gr:#2ecc71;--rd:#ef4444;color-scheme:dark}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding:12px;max-width:900px;margin:auto}
h1{font-size:20px;margin:6px 0 12px}h1 i{color:var(--or);font-style:normal}h2{font-size:17px;margin:14px 0 8px;color:var(--am)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--mu);cursor:pointer;font-weight:600}.tabs button.on{background:var(--or);color:#1a0d00;border-color:var(--or)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
input,select,textarea{width:100%;background:#0a1330;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:9px;margin:4px 0;font:inherit}
button.b{background:var(--or);color:#1a0d00;border:0;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;margin:2px}button.b.g{background:var(--gr)}button.b.r{background:var(--rd);color:#fff}button.b.x{background:#26345a;color:var(--tx)}
.mu{color:var(--mu);font-size:14px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.st{padding:2px 8px;border-radius:10px;font-size:12px;font-weight:700;background:#26345a}
#toast{position:fixed;bottom:16px;left:12px;right:12px;max-width:600px;margin:auto;background:#12306b;border:1px solid var(--am);padding:10px;border-radius:8px;display:none;z-index:9}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
</style></head><body>
<h1>THE <i>ALPHA</i> GAMER · Admin</h1><div id="root"></div><div id="toast"></div>
<script>
var $=function(i){return document.getElementById(i)},CFG={categories:[]},tab='deposits';
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function api(m,p,b){return fetch(p,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined}).then(function(r){return r.json().then(function(j){j.status=r.status;return j})}).catch(function(){return{error:'Network problem',status:0}})}
function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';setTimeout(function(){t.style.display='none'},3500)}
function fd(x){return new Date(typeof x==='number'?x:String(x).replace(' ','T')+'Z').toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}
function act(m,p,b,after){api(m,p,b||{}).then(function(r){if(r.error)toast(r.error);else{toast('Done');if(after)after(r);else show()}})}
function up(file,cb){if(!file)return;if(file.size>20*1024*1024)return toast('Max 20 MB per image');toast('Uploading '+Math.round(file.size/1024)+' KB…');
fetch('/api/admin/upload',{method:'POST',headers:{'Content-Type':file.type||'application/octet-stream'},body:file}).then(function(r){return r.json()}).then(function(j){j.url?cb(j.url):toast(j.error||'Upload failed')}).catch(function(){toast('Upload failed')})}
function login(){$('root').innerHTML='<div class="card" style="max-width:380px"><input id="e" type="email" placeholder="Admin Gmail" autocomplete="email"><input id="p" type="password" placeholder="Password" autocomplete="current-password"><button class="b" id="go">Login</button></div>';
$('go').onclick=function(){api('POST','/api/admin/login',{email:$('e').value,password:$('p').value}).then(function(r){if(r.user)boot();else toast(r.error)})};$('p').onkeydown=function(e){if(e.key==='Enter')$('go').click()}}
function boot(){api('GET','/api/config').then(function(c){CFG=c;return api('GET','/api/admin/summary')}).then(function(s){if(s.status===401||s.status===403)return login();frame(s)})}
function frame(s){var T=[['deposits','Deposits ('+s.pendingDeposits+')'],['withdrawals','Withdrawals ('+s.pendingWithdrawals+')'],['tournaments','Tournaments'],['users','Users ('+s.users+')'],['settings','Settings'],['logs','Logs']];
$('root').innerHTML='<div class="tabs">'+T.map(function(t){return'<button data-t="'+t[0]+'" class="'+(tab===t[0]?'on':'')+'">'+t[1]+'</button>'}).join('')+'<button class="x b" id="lo" style="margin-left:auto">Logout</button></div><div id="v"></div>';
[].forEach.call(document.querySelectorAll('[data-t]'),function(b){b.onclick=function(){tab=b.dataset.t;boot()}});$('lo').onclick=function(){api('POST','/api/logout').then(login)};show()}
function show(){var v=$('v');({deposits:pDep,withdrawals:pWd,tournaments:pT,users:pU,settings:pSet,logs:pLog})[tab](v)}
function pDep(v){api('GET','/api/admin/deposits?status=pending').then(function(r){v.innerHTML='<p class="mu">Check each payment in your bank/Jio app (amount + UTR) BEFORE approving. Approving adds coins once.</p>'+((r.rows||[]).length?r.rows.map(function(d){return'<div class="card"><b>₹'+d.amount+'</b> · '+esc(d.gamer_name)+' <span class="mu">'+esc(d.email)+'</span><div>UTR: <b>'+esc(d.utr)+'</b> <span class="mu">'+fd(d.created_at)+'</span></div><button class="b g" data-a="'+d.id+'">Approve</button><button class="b r" data-r="'+d.id+'">Reject</button></div>'}).join(''):'<div class="card mu">No pending deposits.</div>');
[].forEach.call(v.querySelectorAll('[data-a]'),function(b){b.onclick=function(){if(confirm('Payment received in your account? Approve and add coins?'))act('POST','/api/admin/deposits/'+b.dataset.a+'/approve',{},function(){boot()})}});
[].forEach.call(v.querySelectorAll('[data-r]'),function(b){b.onclick=function(){if(confirm('Reject this deposit?'))act('POST','/api/admin/deposits/'+b.dataset.r+'/reject',{},function(){boot()})}})})}
function pWd(v){api('GET','/api/admin/withdrawals').then(function(r){v.innerHTML='<p class="mu">Pay the UPI ID yourself, then press Mark paid and enter your payout UTR. Reject refunds the coins to the player.</p>'+((r.rows||[]).length?r.rows.map(function(w){return'<div class="card"><b>₹'+w.amount+'</b> → <b>'+esc(w.upi)+'</b> <span class="st">'+w.status+'</span><div class="mu">'+esc(w.gamer_name)+' · '+esc(w.email)+' · '+fd(w.created_at)+'</div>'+(w.status==='pending'?'<button class="b x" data-ap="'+w.id+'">Approve</button>':'')+'<button class="b g" data-c="'+w.id+'">Mark paid</button><button class="b r" data-r="'+w.id+'">Reject</button></div>'}).join(''):'<div class="card mu">No open withdrawals.</div>');
[].forEach.call(v.querySelectorAll('[data-ap]'),function(b){b.onclick=function(){act('POST','/api/admin/withdrawals/'+b.dataset.ap+'/approve',{},function(){boot()})}});
[].forEach.call(v.querySelectorAll('[data-c]'),function(b){b.onclick=function(){var ref=prompt('Payout UTR / reference');if(ref)act('POST','/api/admin/withdrawals/'+b.dataset.c+'/complete',{ref:ref},function(){boot()})}});
[].forEach.call(v.querySelectorAll('[data-r]'),function(b){b.onclick=function(){if(confirm('Reject and refund coins?'))act('POST','/api/admin/withdrawals/'+b.dataset.r+'/reject',{},function(){boot()})}})})}
function pU(v){v.innerHTML='<input id="q" placeholder="Search Gmail, gamer name or UID"><div id="ul"></div>';var go=function(){api('GET','/api/admin/users?q='+encodeURIComponent($('q').value)).then(function(r){$('ul').innerHTML=(r.rows||[]).map(function(u){return'<div class="card"><b>'+esc(u.gamer_name)+'</b> · UID '+esc(u.ff_uid)+(u.role==='admin'?' <span class="st">admin</span>':'')+(u.blocked?' <span class="st" style="background:#7a1f1f">blocked</span>':'')+'<div class="mu">'+esc(u.email)+' · joined '+fd(u.created_at)+'</div><div>Deposit '+u.deposit_bal+' · Winning '+u.win_bal+'</div>'+(u.role==='admin'?'':'<button class="b '+(u.blocked?'g':'r')+'" data-b="'+u.id+'" data-v="'+(u.blocked?0:1)+'">'+(u.blocked?'Unblock':'Block')+'</button>')+'<button class="b x" data-l="'+u.id+'">Ledger</button><div id="lg'+u.id+'"></div></div>'}).join('');
[].forEach.call($('ul').querySelectorAll('[data-b]'),function(b){b.onclick=function(){act('POST','/api/admin/users/'+b.dataset.b+'/block',{blocked:b.dataset.v==='1'},go)}});
[].forEach.call($('ul').querySelectorAll('[data-l]'),function(b){b.onclick=function(){api('GET','/api/admin/users/'+b.dataset.l+'/ledger').then(function(r){$('lg'+b.dataset.l).innerHTML='<table>'+r.rows.map(function(t){return'<tr><td>'+fd(t.created_at)+'</td><td>'+t.kind+' '+t.wallet+'</td><td>'+t.amount+'</td><td>'+esc(t.reason)+' '+esc(t.note||'')+'</td></tr>'}).join('')+'</table>'})}})})};
$('q').oninput=function(){clearTimeout(window._t);window._t=setTimeout(go,300)};go()}
function pSet(v){api('GET','/api/admin/settings').then(function(s){var ci=s.catImages||{};
v.innerHTML='<div class="card"><b>Payment — change anytime</b><input id="su" placeholder="UPI ID, e.g. name@jio" value="'+esc(s.upiId)+'"><input id="sn" placeholder="Payee name" value="'+esc(s.upiName)+'"><div class="mu" style="margin-top:8px">QR code image (scanner) shown to players</div>'+(s.qrImage?'<img src="'+esc(s.qrImage)+'" style="width:170px;background:#fff;padding:6px;border-radius:8px;display:block;margin:6px 0">':'<p class="mu">No QR set.</p>')+'<input type="file" id="qf" accept="image/*"><button class="b x" id="q0">Remove custom QR (use bundled)</button></div>'+
'<div class="card"><b>Category thumbnails</b><div class="mu">Upload photos (JPG/PNG/WEBP, up to 20 MB each). Used on Home tiles and on matches without their own banner.</div>'+(s.categories||[]).map(function(c){return'<div class="g2" style="align-items:center;margin-top:8px"><div><b>'+esc(c.name)+'</b>'+(ci[c.id]?'<img src="'+esc(ci[c.id])+'" style="height:56px;border-radius:6px;display:block;margin-top:4px">':'')+'</div><div><input type="file" accept="image/*" data-cf="'+c.id+'">'+(ci[c.id]?'<button class="b r" data-cr="'+c.id+'">Remove</button>':'')+'</div></div>'}).join('')+'</div>'+
'<div class="card"><b>Customer care WhatsApp number</b><input id="wa" value="'+esc(s.whatsapp)+'" placeholder="+63 930 941 5509"></div><div class="card"><b>Announcement (shown on Home)</b><textarea id="no" rows="2" maxlength="300">'+esc(s.notice)+'</textarea></div>'+
'<div class="card g2"><div><b>Minimum withdrawal</b><input id="mw" type="number" value="'+s.minWithdraw+'"></div><div><b>Show room (minutes before start)</b><input id="rm" type="number" value="'+s.roomMins+'"></div><div><b>Referral reward (coins)</b><input id="rr" type="number" value="'+s.referralReward+'"></div><div><b>Referral: min first deposit</b><input id="rd" type="number" value="'+s.referralMinDeposit+'"></div></div><button class="b" id="sv">Save settings</button>';
$('qf').onchange=function(){up(this.files[0],function(u){act('PUT','/api/admin/settings',{qrImage:u},function(){toast('QR updated');pSet(v)})})};
$('q0').onclick=function(){act('PUT','/api/admin/settings',{qrImage:''},function(){pSet(v)})};
[].forEach.call(v.querySelectorAll('[data-cf]'),function(i){i.onchange=function(){var id=i.dataset.cf;up(i.files[0],function(u){var o={};o[id]=u;act('PUT','/api/admin/settings',{catImages:o},function(){toast('Thumbnail updated');pSet(v)})})}});
[].forEach.call(v.querySelectorAll('[data-cr]'),function(b){b.onclick=function(){var o={};o[b.dataset.cr]='';act('PUT','/api/admin/settings',{catImages:o},function(){pSet(v)})}});
$('sv').onclick=function(){act('PUT','/api/admin/settings',{upiId:$('su').value,upiName:$('sn').value,whatsapp:$('wa').value,notice:$('no').value,minWithdraw:+$('mw').value,roomMins:+$('rm').value,referralReward:+$('rr').value,referralMinDeposit:+$('rd').value},function(){toast('Saved');pSet(v)})}})}
function pLog(v){api('GET','/api/admin/logs').then(function(r){v.innerHTML='<div class="card"><table>'+r.rows.map(function(l){return'<tr><td>'+fd(l.created_at)+'</td><td>'+esc(l.email||'-')+'</td><td>'+esc(l.action)+'</td><td>'+esc(l.detail||'')+'</td></tr>'}).join('')+'</table></div>'})}
/* tournaments */
function dtl(ms){var d=new Date(ms-new Date().getTimezoneOffset()*60000);return d.toISOString().slice(0,16)}
function pT(v){api('GET','/api/admin/tournaments').then(function(r){var rows=r.rows||[];v.innerHTML='<button class="b" id="nw">+ New tournament</button><div id="fm"></div>'+rows.map(function(t){return'<div class="card"><b>'+esc(t.title)+'</b> #'+t.id+' <span class="st">'+t.state+(t.status==='cancelled'?' · cancelled':'')+'</span><div class="mu">'+esc(t.category)+' · '+t.mode+' · '+esc(t.map)+' · '+fd(t.startsAt)+' · entry '+t.entryFee+' · pool '+t.prizePool+' · slots '+t.booked+'/'+t.totalSlots+'</div>'+
(t.status==='upcoming'?'<button class="b x" data-e="'+t.id+'">Edit</button><button class="b x" data-rm="'+t.id+'">Room ID/Pass'+(t.roomId?' ✓':'')+'</button>':'')+'<button class="b x" data-p="'+t.id+'">Players</button>'+(t.status==='upcoming'&&t.state==='ongoing'?'<button class="b g" data-rs="'+t.id+'">Publish results</button>':'')+(t.status==='upcoming'?'<button class="b r" data-cx="'+t.id+'">Cancel &amp; refund</button>':'')+(t.booked===0&&t.status==='upcoming'?'<button class="b r" data-d="'+t.id+'">Delete</button>':'')+'<div id="x'+t.id+'"></div></div>'}).join('');
var by=function(id){return rows.filter(function(t){return t.id==id})[0]};
$('nw').onclick=function(){form(null)};
[].forEach.call(v.querySelectorAll('[data-e]'),function(b){b.onclick=function(){form(by(b.dataset.e))}});
[].forEach.call(v.querySelectorAll('[data-d]'),function(b){b.onclick=function(){if(confirm('Delete this match?'))act('DELETE','/api/admin/tournaments/'+b.dataset.d,null,function(){pT(v)})}});
[].forEach.call(v.querySelectorAll('[data-cx]'),function(b){b.onclick=function(){if(confirm('Cancel this match and refund all players?'))act('POST','/api/admin/tournaments/'+b.dataset.cx+'/cancel',{},function(){pT(v)})}});
[].forEach.call(v.querySelectorAll('[data-rm]'),function(b){b.onclick=function(){var t=by(b.dataset.rm),id=prompt('Room ID',t.roomId||'');if(!id)return;var pw=prompt('Room password',t.roomPass||'');if(pw)act('POST','/api/admin/tournaments/'+t.id+'/room',{roomId:id,roomPass:pw},function(){pT(v)})}});
[].forEach.call(v.querySelectorAll('[data-p]'),function(b){b.onclick=function(){api('GET','/api/admin/tournaments/'+b.dataset.p+'/players').then(function(p){$('x'+b.dataset.p).innerHTML='<table><tr><th>Pos</th><th>In-game name</th><th>UID</th><th>Account</th></tr>'+p.rows.map(function(x){return'<tr><td>'+x.slot+'</td><td>'+esc(x.player_name)+'</td><td>'+esc(x.player_uid)+'</td><td>'+esc(x.gamer_name)+'</td></tr>'}).join('')+'</table>'})}});
[].forEach.call(v.querySelectorAll('[data-rs]'),function(b){b.onclick=function(){var t=by(b.dataset.rs);api('GET','/api/admin/tournaments/'+t.id+'/players').then(function(p){$('x'+t.id).innerHTML='<p class="mu">Enter kills and rank prize per player (blank = 0). Per-kill ('+t.perKill+') is added automatically. Can be published only once.</p><table><tr><th>Player</th><th>Kills</th><th>Rank prize</th></tr>'+p.rows.map(function(x){return'<tr><td>'+esc(x.player_name)+'<div class="mu">'+esc(x.player_uid)+'</div></td><td><input data-k="'+esc(x.player_uid)+'" type="number" min="0"></td><td><input data-z="'+esc(x.player_uid)+'" type="number" min="0"></td></tr>'}).join('')+'</table><button class="b g" id="pub'+t.id+'">Publish &amp; pay winners</button>';
$('pub'+t.id).onclick=function(){var rowsx=p.rows.map(function(x){return{uid:x.player_uid,kills:+(document.querySelector('[data-k="'+x.player_uid+'"]').value||0),rankPrize:+(document.querySelector('[data-z="'+x.player_uid+'"]').value||0)}});if(confirm('Publish results and credit winners? This cannot be undone.'))act('POST','/api/admin/tournaments/'+t.id+'/results',{rows:rowsx},function(r){toast('Paid '+r.paid+' coins');pT(v)})}})}})})}
function form(t){var f=$('fm');t=t||{category:'br-survival',mode:'solo',map:'Bermuda',entryFee:10,prizePool:100,perKill:0,totalSlots:48,startsAt:Date.now()+3600e3,title:'',prizeText:'Top 1: \nTop 2: ',rules:'• Record room entry and gameplay\n• Hackers/teaming = ban\n• Minimum level 40',banner:''};
f.innerHTML='<div class="card"><b>'+(t.id?'Edit #'+t.id:'New tournament')+'</b><input id="ti" placeholder="Title" value="'+esc(t.title)+'"><div class="g2"><select id="ca">'+CFG.categories.map(function(c){return'<option value="'+c.id+'" '+(c.id===t.category?'selected':'')+'>'+esc(c.name)+'</option>'}).join('')+'</select><select id="mo">'+['solo','duo','squad'].map(function(m){return'<option '+(m===t.mode?'selected':'')+'>'+m+'</option>'}).join('')+'</select></div><div class="g2"><input id="mp" placeholder="Map" value="'+esc(t.map)+'"><input id="ts" type="number" placeholder="Total player slots" value="'+t.totalSlots+'"></div><div class="g2"><div><span class="mu">Entry fee (per player)</span><input id="ef" type="number" value="'+t.entryFee+'"></div><div><span class="mu">Prize pool</span><input id="pp" type="number" value="'+t.prizePool+'"></div></div><div class="g2"><div><span class="mu">Per kill</span><input id="pk" type="number" value="'+t.perKill+'"></div><div><span class="mu">Start time</span><input id="st" type="datetime-local" value="'+dtl(t.startsAt)+'"></div></div><span class="mu">Prize details (shown to players)</span><textarea id="pt" rows="3">'+esc(t.prizeText)+'</textarea><span class="mu">Rules</span><textarea id="ru" rows="4">'+esc(t.rules)+'</textarea><div class="mu">Match banner / thumbnail (optional — else the category photo is used)</div><input type="file" id="bf" accept="image/*"><input id="bn" placeholder="…or paste an https image URL" value="'+esc(t.banner)+'">'+(t.banner?'<img src="'+esc(t.banner)+'" style="height:70px;border-radius:6px;display:block">':'')+'<p class="mu">Slots must be a multiple of team size (solo 1, duo 2, squad 4). 1v1 = 2 slots, 2v2 = 4 slots.</p><button class="b g" id="sv">'+(t.id?'Save changes':'Create')+'</button><button class="b x" id="cl">Close</button></div>';
$('cl').onclick=function(){f.innerHTML=''};$('bf').onchange=function(){up(this.files[0],function(u){$('bn').value=u;toast('Image uploaded. Now press Save.')})};$('sv').onclick=function(){var b={title:$('ti').value,category:$('ca').value,mode:$('mo').value,map:$('mp').value,totalSlots:+$('ts').value,entryFee:+$('ef').value,prizePool:+$('pp').value,perKill:+$('pk').value,startsAt:new Date($('st').value).getTime(),prizeText:$('pt').value,rules:$('ru').value,banner:$('bn').value};
act(t.id?'PUT':'POST','/api/admin/tournaments'+(t.id?'/'+t.id:''),b,function(){toast('Saved');pT($('v'))})}}
boot();
</script></body></html>
